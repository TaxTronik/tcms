# =============================================================================
# CI des Tax-CMS (Forgejo Actions, ADR 0001 §8). Vorbild: die Workflows der
# kanzleikonsole (ci.yml, security.yml, build-images.yml, release.yml):
# Actions per Commit-SHA, Images und Werkzeuge per Digest bzw. SHA-256
# gepinnt, minimale Rechte, Geheimnisse nur als Forgejo-Secrets.
#
#   qualitaet   Lieferkette, frische Installation, Format, Typecheck,
#               Unit-Tests, Dockerfile-/Kontext-Regeln, hadolint, shellcheck,
#               Builds von apps/web und apps/api
#   datenbank   tcms-migrate gegen PostgreSQL 18 (Erst- und Zweitlauf), Seed,
#               alle Tests mit DB_TESTS=1 zweimal auf derselben Datenbank,
#               Laufzeit-Simulation des Images, Tests des Migrationsläufers
#   sicherheit  gitleaks über die ganze Historie, pnpm audit --prod
#   images      baut tcms-api und tcms-migrate; nur auf Tags v*: Trivy-Gate,
#               SBOM, Push nach ${REGISTRY}/taxtronik/tcms-{api,migrate}
#               (write-once) und Ausgabe der Digests für das signierte
#               Release-Manifest der kanzleikonsole
#
# Runner: act_runner startet Services im Host-Netz; der PostgreSQL-Service
# nutzt deshalb einen eigenen Port (15432), Runner-Kapazität 1 je Daemon wie
# in der kanzleikonsole.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tcms-ci-${{ github.ref }}
  # Ein Release-Lauf wird nie abgebrochen.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_ENV: test
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  qualitaet:
    name: Lieferkette, Format, Typecheck, Tests, Image-Regeln, Builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # Vor jeder Installation: ein vergifteter Paketbaum kann diese Prüfung
      # nicht beeinflussen (reines sh).
      - name: Lieferketten-Regeln prüfen
        run: sh scripts/pruefe-lieferkette.sh

      # Frischer Store: strictDepBuilds und allowBuilds greifen bei jedem Lauf.
      - name: Installation (frozen lockfile, frischer Store)
        run: pnpm install --frozen-lockfile --store-dir "$(mktemp -d)"

      - name: Prisma-Client erzeugen
        run: pnpm db:generate

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm -r --workspace-concurrency=1 run typecheck

      - name: Tests ohne Datenbank
        run: |
          set -o pipefail
          pnpm -r --workspace-concurrency=1 run test 2>&1 | tee testbericht-unit.log

      - name: Dockerfile und Build-Kontext
        run: node scripts/pruefe-dockerfile.mjs

      - name: hadolint (Version und SHA-256 gepinnt)
        env:
          HADOLINT_VERSION: 2.12.0
          HADOLINT_SHA256: 56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          curl -fsSL -o "$d/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  $d/hadolint" | sha256sum -c -
          chmod 0755 "$d/hadolint"
          "$d/hadolint" Dockerfile

      - name: shellcheck (Version und SHA-256 gepinnt)
        env:
          SHELLCHECK_VERSION: 0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          curl -fsSL -o "$d/sc.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $d/sc.tar.xz" | sha256sum -c -
          tar -xJf "$d/sc.tar.xz" -C "$d"
          "$d/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" -x \
            packages/db/betrieb/migrate.sh scripts/*.sh

      - name: Builds (apps/web, apps/api)
        run: |
          pnpm --filter @tcms/web build
          pnpm --filter @tcms/api build

      - name: Testnachweis hochladen
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: testbericht-unit
          retention-days: 90
          path: testbericht-unit.log
          if-no-files-found: ignore

  datenbank:
    name: tcms-migrate, DB-Tests, Laufzeit-Simulation (PostgreSQL 18)
    runs-on: ubuntu-latest
    needs: qualitaet
    timeout-minutes: 30
    services:
      postgres:
        # Dasselbe Image wie die TCMS-Datenbank im Betrieb (Digest).
        image: postgres:18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
        env:
          POSTGRES_USER: tcms
          # Nur für diesen kurzlebigen CI-Service; kein Geheimnis.
          POSTGRES_PASSWORD: tcms-ci-superuser
          POSTGRES_DB: tcms
          PGPORT: '15432'
        ports:
          - 15432:15432
        options: >-
          --health-cmd "pg_isready -U tcms -d tcms"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TCMS_DB_SUPERUSER_URL: postgresql://tcms:tcms-ci-superuser@localhost:15432/tcms
      TCMS_DB_OWNER_URL: postgresql://tcms_owner@localhost:15432/tcms
      DATABASE_SUPERUSER_URL: postgresql://tcms:tcms-ci-superuser@localhost:15432/tcms
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Lieferketten-Regeln prüfen
        run: sh scripts/pruefe-lieferkette.sh

      - name: Installation (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma-Client erzeugen
        run: pnpm db:generate

      # Der Läufer braucht psql >= 15 (\getenv); kein Node, keine Prisma-CLI.
      # Ubuntu 22.04 liefert nur psql 14 (CI-Lauf 3884: „invalid command
      # \getenv“). Daher der Client 18 wie im Image tcms-migrate aus dem
      # PGDG-Repository; dessen Signaturschlüssel wird über den gepinnten
      # Fingerabdruck geprüft, bevor apt ihm vertraut.
      - name: PostgreSQL-Client (18 aus PGDG, Schlüssel-Fingerabdruck gepinnt)
        env:
          PG_CLIENT_MAJOR: '18'
          PGDG_KEY_FINGERPRINT: B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
        run: |
          set -euo pipefail
          hauptversion() { psql --version 2>/dev/null | sed -n 's/^psql (PostgreSQL) \([0-9][0-9]*\).*/\1/p'; }
          if [ "$(hauptversion || true)" != "$PG_CLIENT_MAJOR" ]; then
            SUDO=""
            if command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends ca-certificates curl gnupg
            d="$(mktemp -d)"
            curl -fsSL -o "$d/pgdg.asc" https://www.postgresql.org/media/keys/ACCC4CF8.asc
            # Genau ein Hauptschlüssel mit dem gepinnten Fingerabdruck
            # (Unterschlüssel sind an ihn gebunden).
            haupt="$(gpg --show-keys --with-colons "$d/pgdg.asc" |
              awk -F: '$1 == "pub" { p = 1; next } p && $1 == "fpr" { print $10; p = 0 }')"
            if [ "$haupt" != "$PGDG_KEY_FINGERPRINT" ]; then
              echo "PGDG-Schlüssel hat einen unerwarteten Fingerabdruck: $haupt" >&2
              exit 1
            fi
            $SUDO install -D -m 0644 "$d/pgdg.asc" /usr/share/keyrings/tcms-pgdg.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/keyrings/tcms-pgdg.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" |
              $SUDO tee /etc/apt/sources.list.d/tcms-pgdg.list
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends "postgresql-client-${PG_CLIENT_MAJOR}"
          fi
          psql --version
          [ "$(hauptversion)" = "$PG_CLIENT_MAJOR" ] || { echo "psql ist nicht Version ${PG_CLIENT_MAJOR}" >&2; exit 1; }

      # Rollenpasswörter je Lauf, maskiert, nur in der Umgebung dieses Jobs.
      - name: Rollenpasswörter erzeugen
        run: |
          set -euo pipefail
          owner="$(openssl rand -hex 24)"
          app="$(openssl rand -hex 24)"
          echo "::add-mask::${owner}"
          echo "::add-mask::${app}"
          {
            echo "TCMS_DB_OWNER_PASSWORD=${owner}"
            echo "TCMS_DB_APP_PASSWORD=${app}"
            echo "DATABASE_URL=postgresql://tcms_app:${app}@localhost:15432/tcms"
            echo "DATABASE_OWNER_URL=postgresql://tcms_owner:${owner}@localhost:15432/tcms"
          } >> "$GITHUB_ENV"

      - name: tcms-migrate (Erstlauf und idempotenter Zweitlauf)
        run: |
          bash packages/db/betrieb/migrate.sh
          bash packages/db/betrieb/migrate.sh

      - name: Demodaten (Seed als tcms_owner, nur für Tests)
        env:
          TCMS_DEMO_TODAY: '2026-10-16'
        run: pnpm db:seed

      - name: Alle Tests mit Datenbank, zweimal auf derselben Datenbank
        env:
          DB_TESTS: '1'
        run: |
          set -o pipefail
          for lauf in 1 2; do
            echo "== Lauf ${lauf}/2"
            pnpm -r --workspace-concurrency=1 run test 2>&1 | tee -a testbericht-db.log
          done

      - name: Laufzeit-Simulation des Images tcms-api
        run: bash scripts/simuliere-image.sh "${RUNNER_TEMP}/tcms-sim"

      # Zuletzt: setzt die clusterweiten Rollenpasswörter und stellt die
      # Werte dieses Jobs am Ende wieder her.
      - name: Tests des Migrationsläufers
        env:
          TCMS_MIGRATE_TESTS: '1'
          TCMS_MIGRATE_TEST_SUPERUSER_URL: postgresql://tcms:tcms-ci-superuser@localhost:15432/postgres
        run: |
          set -o pipefail
          TCMS_MIGRATE_TEST_OWNER_PASSWORD="$TCMS_DB_OWNER_PASSWORD" \
          TCMS_MIGRATE_TEST_APP_PASSWORD="$TCMS_DB_APP_PASSWORD" \
            pnpm --filter @tcms/db exec vitest run src/__tests__/migrate.db.test.ts 2>&1 \
            | tee -a testbericht-db.log

      - name: Testnachweis hochladen
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: testbericht-db
          retention-days: 90
          path: testbericht-db.log
          if-no-files-found: ignore

  sicherheit:
    name: Secret-Scan und Abhängigkeitsprüfung
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.29.0
      GITLEAKS_LINUX_X64_SHA256: 39e07ad810336fd0ae80d0bd61c60d0521f628173e7583583b5df4a38738522c
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: gitleaks (Version und SHA-256 gepinnt)
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          curl -fsSL -o "$d/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  $d/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$d/gitleaks.tar.gz" -C "$d" gitleaks
          "$d/gitleaks" git --redact --no-banner --verbose . 2>&1 | tee security-gitleaks.log

      # Produktionsabhängigkeiten (Laufzeitbaum des Dienstes und der Demo).
      - name: pnpm audit --prod
        run: |
          set -o pipefail
          pnpm audit --prod --audit-level high 2>&1 | tee security-audit-prod.log

      - name: Sicherheitsnachweis hochladen
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: sicherheit
          retention-days: 90
          path: |
            security-gitleaks.log
            security-audit-prod.log
          if-no-files-found: ignore

  images:
    name: Images tcms-api und tcms-migrate
    runs-on: ubuntu-latest
    needs: [qualitaet, datenbank, sicherheit]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Version, Präfix und Metadaten
        id: meta
        env:
          REGISTRY: ${{ vars.REGISTRY }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag ist keine Version X.Y.Z"; exit 1; }
            PAKET="$(node -p "require('./apps/api/package.json').version")"
            [[ "$VERSION" == "$PAKET" ]] || { echo "::error::Tag $VERSION passt nicht zu apps/api ($PAKET)"; exit 1; }
            [[ -n "$REGISTRY" ]] || { echo "::error::Forgejo-Variable REGISTRY fehlt"; exit 1; }
            PRAEFIX="${REGISTRY}/taxtronik"
            PUSH=true
          else
            VERSION="0.0.0-ci.${GITHUB_SHA::12}"
            PRAEFIX="ci.invalid/taxtronik"
            PUSH=false
          fi
          {
            echo "version=$VERSION"
            echo "praefix=$PRAEFIX"
            echo "push=$PUSH"
            echo "created=$(git show -s --format=%cI "$GITHUB_SHA")"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: tcms-api bauen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          target: api
          push: false
          load: true
          tags: ${{ steps.meta.outputs.praefix }}/tcms-api:${{ steps.meta.outputs.version }}
          build-args: |
            TCMS_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: tcms-migrate bauen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          target: migrate
          push: false
          load: true
          tags: ${{ steps.meta.outputs.praefix }}/tcms-migrate:${{ steps.meta.outputs.version }}
          build-args: |
            TCMS_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Nicht-root und kein Werkzeug im Image (Kurzprüfung)
        env:
          API: ${{ steps.meta.outputs.praefix }}/tcms-api:${{ steps.meta.outputs.version }}
          MIGRATE: ${{ steps.meta.outputs.praefix }}/tcms-migrate:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "$API")" = '10001:10001'
          test "$(docker image inspect --format '{{.Config.User}}' "$MIGRATE")" = '70:70'
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint sh "$API" -c \
            'test ! -e /app/node_modules/tsx && test ! -e /app/node_modules/prisma && ! command -v npm'

      # Trivy aus dem digest-gepinnten Image (wie die kanzleikonsole), nur vor
      # einem Push: CRITICAL mit verfügbarem Fix blockiert.
      - name: Trivy-Gate und SBOM
        if: steps.meta.outputs.push == 'true'
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:2a335d3a73d4e1d52d73c8ef417ab0f91f86ba0a912caf8227665b988a6f4015
          PRAEFIX: ${{ steps.meta.outputs.praefix }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          TRIVY_BIN="$RUNNER_TEMP/trivy"
          C="$(docker create "$TRIVY_IMAGE")"
          docker cp "$C:/usr/local/bin/trivy" "$TRIVY_BIN"
          docker rm "$C" >/dev/null
          chmod 0755 "$TRIVY_BIN"
          mkdir -p release-sbom
          for img in tcms-api tcms-migrate; do
            ref="$PRAEFIX/$img:$VERSION"
            "$TRIVY_BIN" image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$ref"
            "$TRIVY_BIN" image --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet "$ref"
            "$TRIVY_BIN" image --format cyclonedx --output "release-sbom/$img.cdx.json" "$ref"
          done

      - name: SBOM hochladen
        if: steps.meta.outputs.push == 'true'
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: tcms-sbom-${{ steps.meta.outputs.version }}
          retention-days: 90
          path: release-sbom/*.cdx.json
          if-no-files-found: error

      - name: Registry-Login
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Versions-Tags sind write-once; danach die Digests für das signierte
      # Release-Manifest der kanzleikonsole (infra/compose/tcms-release.env).
      - name: Push und Digests
        if: steps.meta.outputs.push == 'true'
        env:
          PRAEFIX: ${{ steps.meta.outputs.praefix }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for img in tcms-api tcms-migrate; do
            ref="$PRAEFIX/$img:$VERSION"
            if AUSGABE="$(docker manifest inspect "$ref" 2>&1)"; then
              echo "::error::Release-Referenz existiert bereits: $ref"
              exit 1
            elif [ "$AUSGABE" = "no such manifest: $ref" ] ||
              [ "$AUSGABE" = "manifest unknown" ] ||
              [ "$AUSGABE" = "manifest unknown: manifest unknown" ]; then
              : # eindeutig frei
            else
              echo "::error::Registry-Status für $ref nicht eindeutig; kein Push (fail closed)"
              exit 1
            fi
          done
          {
            echo "### TCMS $VERSION"
            echo
            echo "TCMS_RELEASE_VERSION=$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
          for img in tcms-api tcms-migrate; do
            ref="$PRAEFIX/$img:$VERSION"
            docker push "$ref"
            digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ref" \
              | grep -F "$PRAEFIX/$img@" | head -1 | cut -d@ -f2)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Digest von $img fehlt"; exit 1; }
            echo "$img $ref@$digest"
            key="$(echo "${img#tcms-}" | tr '[:lower:]' '[:upper:]')"
            echo "TCMS_RELEASE_${key}_DIGEST=$digest" >> "$GITHUB_STEP_SUMMARY"
          done
